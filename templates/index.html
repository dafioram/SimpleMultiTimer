<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Timer</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 10px;
        }

        /* --- Header & Sync Status --- */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .header-title { font-size: 1.5rem; font-weight: bold; color: #fff; margin: 0; }
        
        .sync-badge {
            font-size: 0.9rem; font-weight: bold; padding: 5px 10px; border-radius: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .sync-ok { color: #00e676; background: rgba(0, 230, 118, 0.1); border: 1px solid #00e676; }
        .sync-err { color: #ff5252; background: rgba(255, 82, 82, 0.1); border: 1px solid #ff5252; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
        }

        /* --- Add Bar --- */
        .add-form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex-grow: 1; padding: 15px; border-radius: 8px; border: none; 
            font-size: 16px; background: #2c2c2c; color: white; outline: none;
        }
        button.add-btn {
            background-color: #bb86fc; border: none; padding: 0 20px;
            border-radius: 8px; color: #000; font-weight: bold; font-size: 24px;
        }

        /* --- Timer Card --- */
        .timer-card {
            background-color: #1e1e1e;
            padding: 15px; margin-bottom: 12px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            border-left: 6px solid #333;
        }
        
        .timer-card.running {
            background-color: #1b2e23;
            border-left: 6px solid #00e676; 
        }

        /* --- Text Info --- */
        .timer-info { flex-grow: 1; margin-right: 20px; }
        
        .timer-name { font-size: 1.1rem; font-weight: 600; color: #bb86fc; display: block; margin-bottom: 4px;}
        .timer-display { font-size: 1.8rem; font-family: monospace; font-weight: bold; color: #fff; }

        /* --- Action Buttons --- */
        .controls { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        
        .btn {
            padding: 12px 0; width: 90px; border-radius: 8px; text-decoration: none;
            font-weight: bold; font-size: 1rem; text-align: center; display: inline-block;
        }
        .start-btn { background-color: #03dac6; color: #000; }
        .stop-btn { background-color: #cf6679; color: #000; }

        .delete-btn { text-decoration: none; color: #555; font-size: 1.5rem; padding: 5px; }
        .delete-btn:hover { color: #ff5252; }

        /* --- Edit Mode Styles --- */
        .edit-icon-btn {
            background: none; border: none; color: #666; cursor: pointer;
            font-size: 1.2rem; margin-left: 10px; transition: color 0.2s;
        }
        .edit-icon-btn:hover { color: #bb86fc; }

        .edit-form { display: flex; align-items: center; gap: 8px; }
        
        .edit-input {
            width: 130px; flex-grow: 0;
            padding: 5px; border-radius: 4px; border: 1px solid #444;
            background: #222; color: #fff; font-size: 1.2rem; font-family: monospace;
        }
        .save-btn {
            background-color: #03dac6; border: none; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-weight: bold; color: #000;
        }
        .cancel-btn {
            background: #cf6679; border: none; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-weight: bold; color: black;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1 class="header-title">Activity Timer</h1>
        
        {% if synced %}
            <div class="sync-badge sync-ok">⏱︎ Synced</div>
        {% else %}
            <div class="sync-badge sync-err" title="System clock is not synchronized! Timers may jump.">
                <span>⚠️</span> Time Drift
            </div>
        {% endif %}
    </div>

    <form action="/add" method="POST" class="add-form">
        <input type="text" name="name" placeholder="New Activity..." required autocomplete="off">
        <button type="submit" class="add-btn">+</button>
    </form>

    {% for timer in timers %}
    <div class="timer-card {{ 'running' if timer.start_time else '' }}">

        <div class="timer-info">
            <span class="timer-name">{{ timer.name }}</span>
            
            <div id="display-box-{{ timer.id }}" class="display-box">
                <span class="timer-display" 
                      data-start="{{ timer.start_time if timer.start_time else '0' }}"
                      data-banked="{{ timer.banked_time }}">
                    --:--:--
                </span>
                
                {% if not timer.start_time %}
                <button onclick="toggleEdit('{{ timer.id }}')" class="edit-icon-btn" title="Edit Time">
                    ✎
                </button>
                {% endif %}
            </div>

            <form id="edit-form-{{ timer.id }}" action="/edit_time/{{ timer.id }}" method="POST" class="edit-form" style="display:none;">
                <input type="text" name="new_time" class="edit-input" placeholder="HH:MM (e.g. 1:30)" autocomplete="off">
                <button type="submit" class="save-btn">Save</button>
                <button type="button" onclick="toggleEdit('{{ timer.id }}')" class="cancel-btn">×</button>
            </form>
        </div>
        
        <div class="controls">
        {% if timer.start_time %}
            <a href="/stop/{{ timer.id }}" class="btn stop-btn">Stop</a>
        {% else %}
            <a href="/start/{{ timer.id }}" class="btn start-btn">Start</a>
        {% endif %}

            <a href="/delete/{{ timer.id }}" class="delete-btn" onclick="return confirm('Delete {{ timer.name }}?');">×</a>
        </div>
    </div>
    {% endfor %}

    <script>
        // --- NEW TIME SYNC LOGIC ---
        // 1. Get the Server Time passed from Python (in seconds)
        const serverTimeOnLoad = {{ now }};
        
        // 2. Get the Browser Time right now (in seconds)
        const browserTimeOnLoad = Date.now() / 1000;
        
        // 3. Calculate the difference (Offset)
        // This bridges the gap between Pi time and Your Computer time
        const timeOffset = serverTimeOnLoad - browserTimeOnLoad;

        function toggleEdit(id) {
            const displayBox = document.getElementById(`display-box-${id}`);
            const editForm = document.getElementById(`edit-form-${id}`);
            
            if (editForm.style.display === 'none') {
                displayBox.style.display = 'none';
                editForm.style.display = 'flex';
                editForm.querySelector('input').focus();
            } else {
                displayBox.style.display = 'block';
                editForm.style.display = 'none';
            }
        }

        function formatTime(totalSeconds) {
            const s = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds / 60) % 60).toString().padStart(2, '0');
            const h = Math.floor((totalSeconds / 3600) % 24).toString().padStart(2, '0');
            const d = Math.floor(totalSeconds / 86400);

            if (d > 0) return `${d}d ${h}:${m}:${s}`;
            return `${h}:${m}:${s}`;
        }

        function updateTimers() {
            // 4. Calculate "Corrected Now" using the offset
            const browserNow = Date.now() / 1000;
            const currentServerTime = browserNow + timeOffset;

            document.querySelectorAll('.timer-display').forEach(display => {
                const start = parseInt(display.dataset.start); 
                const banked = parseInt(display.dataset.banked);
                
                // Use currentServerTime instead of browserNow
                // This forces the browser to respect the Pi's clock settings
                const total = start > 0 ? (currentServerTime - start) + banked : banked;
                
                // Prevent negative numbers if clocks are weirdly jittery
                const safeTotal = Math.max(0, total);
                
                display.innerText = formatTime(safeTotal);
            });
        }
        
        setInterval(updateTimers, 250); // Updates 4 times a second
        updateTimers();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("/sw.js")
            .then((registration) => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
</body>
</html>
