<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer History Ledger</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --accent: #bb86fc;
            --success: #03dac6;
            --danger: #cf6679;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin-inline: auto; }

        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        h1 { margin: 0; color: #fff; font-size: 1.8rem; }
        nav a { color: var(--accent); text-decoration: none; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: 16px; border-bottom: 1px solid #333; }
        th { 
			background: #2b2b2b; 
			color: var(--accent); /* This matches your purple accent */
			font-size: 0.9rem; 
			font-weight: 500; 
			text-transform: uppercase; 
		}
        
        .tag { padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
        .tag-session { border: 1px solid var(--success); color: var(--success); }
        .tag-manual { border: 1px solid #ffe082; color: #ffe082; }
        
        .duration-text { color: var(--success); font-family: monospace; font-size: 1.1rem; }
        .date-text { color: #888; font-family: monospace; }
		.date-text { color: #eee; font-family: monospace; }
        
		.btn-delete { background: none; color: var(--accent); border: none; cursor: pointer; font-size: 1.5rem; padding: 0 5px; }
        .btn-delete:hover { opacity: 0.8; }

		.toast {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%) translateY(20px);
			background: #2c2c2c;
			color: white;
			padding: 12px 18px;
			border-radius: 8px;
			border-left: 4px solid var(--success);
			box-shadow: 0 4px 12px rgba(0,0,0,.4);
			opacity: 0;
			transition: opacity .3s ease, transform .3s ease;
			z-index: 9999;
			pointer-events: none;
		}

		.toast.show {
			opacity: 1;
			transform: translateX(-50%) translateY(0);
		}

		.toast.error {
			border-left-color: var(--danger);
		}
		
        @media (max-width: 600px) {
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <h1>📜 Timer Sessions</h1>
        <a href="index.html">← Back</a>
    </nav>

    <table>
        <thead>
            <tr>
                <th>Timer</th>
                <th>Type</th>
                <th class="hide-mobile">Date</th>
                <th>Duration</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>

    <script>
        function showToast(message, isError = false) {
            const toast = document.createElement("div");
            toast.className = `toast${isError ? " error" : ""}`;
            toast.textContent = message;

            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add("show");
            });

            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function loadState(key) {
            const raw = localStorage.getItem(key);
            if (!raw) return [];
            try {
                return JSON.parse(raw);
            } catch (err) {
                console.error(`Corrupted "${key}" data:`, err);
                // Preserve the bad data instead of silently discarding it
                localStorage.setItem(`${key}_corrupted_${Date.now()}`, raw);
                localStorage.removeItem(key);
                showToast(`Your saved ${key} was corrupted and has been reset. A backup was kept.`, true);
                return [];
            }
        }

        let history = loadState('history');

        // In case this page is opened directly (e.g. bookmarked or deep-linked)
        // without index.html having run first.
        async function ensurePersistentStorage() {
            if (navigator.storage?.persist) {
                const already = await navigator.storage.persisted();
                if (!already) await navigator.storage.persist();
            }
        }
        ensurePersistentStorage();

        function formatTime(ms) {
            const isNegative = ms < 0;
            const absMs = Math.abs(ms);
            const totalSeconds = Math.floor(absMs / 1000);
            const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            return `${isNegative ? '-' : ''}${h}:${m}:${s}`;
        }

        // Updated format to YYYY-MM-DD HH:MM (as shown in image)
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0') + ' ' + 
                   String(date.getHours()).padStart(2, '0') + ':' + 
                   String(date.getMinutes()).padStart(2, '0');
        }

        function deleteLog(logId) {
            if (!confirm("Delete this entry?")) return;
            const updated = history.filter(h => h.id !== logId);
            try {
                localStorage.setItem('history', JSON.stringify(updated));
            } catch (err) {
                console.error(err);
                showToast("❌ Couldn't delete — storage error.", true);
                return;
            }
            history = updated;
            renderHistory();
        }

        function renderHistory() {
            const tbody = document.getElementById('history-body');
            const sortedHistory = [...history].sort((a, b) => b.timestamp - a.timestamp);

            tbody.innerHTML = sortedHistory.map(log => `
                <tr>
                    <td style="font-weight: 500;">${log.timerName}</td>
                    <td><span class="tag tag-${log.type}">${log.type.toUpperCase()}</span></td>
                    <td class="hide-mobile date-text">${formatDate(log.timestamp)}</td>
                    <td class="duration-text">${log.duration > 0 ? '+' : ''}${formatTime(log.duration)}</td>
                    <td style="text-align: left;">
                        <button class="btn-delete" onclick="deleteLog('${log.id}')" title="Delete">×</button>
                    </td>
                </tr>
            `).join('');
        }

        renderHistory();
    </script>
</body>
</html>
