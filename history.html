<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer History Ledger</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --accent: #bb86fc;
            --success: #03dac6;
            --danger: #cf6679;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin-inline: auto; }

        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        h1 { margin: 0; color: #fff; font-size: 1.8rem; }
        nav a { color: var(--accent); text-decoration: none; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: 16px; border-bottom: 1px solid #333; }
        th { 
			background: #2b2b2b; 
			color: var(--accent); /* This matches your purple accent */
			font-size: 0.9rem; 
			font-weight: 500; 
			text-transform: uppercase; 
		}
        
        .tag { padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
        .tag-session { border: 1px solid var(--success); color: var(--success); }
        .tag-manual { border: 1px solid #ffe082; color: #ffe082; }
        
        .duration-text { color: var(--success); font-family: monospace; font-size: 1.1rem; }
        .date-text { color: #888; font-family: monospace; }
		.date-text { color: #eee; font-family: monospace; }
        
		.btn-delete { background: none; color: var(--accent); border: none; cursor: pointer; font-size: 1.5rem; padding: 0 5px; }
        .btn-delete:hover { opacity: 0.8; }
		
        @media (max-width: 600px) {
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <h1>📜 Timer Sessions</h1>
        <a href="index.html">← Back</a>
    </nav>

    <table>
        <thead>
            <tr>
                <th>Timer</th>
                <th>Type</th>
                <th class="hide-mobile">Date</th>
                <th>Duration</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>

    <script>
        let history = JSON.parse(localStorage.getItem('history')) || [];

        function formatTime(ms) {
            const isNegative = ms < 0;
            const absMs = Math.abs(ms);
            const totalSeconds = Math.floor(absMs / 1000);
            const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            return `${isNegative ? '-' : ''}${h}:${m}:${s}`;
        }

        // Updated format to YYYY-MM-DD HH:MM (as shown in image)
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0') + ' ' + 
                   String(date.getHours()).padStart(2, '0') + ':' + 
                   String(date.getMinutes()).padStart(2, '0');
        }

        function deleteLog(logId) {
            if (!confirm("Delete this entry?")) return;
            history = history.filter(h => h.id !== logId);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const tbody = document.getElementById('history-body');
            const sortedHistory = [...history].sort((a, b) => b.timestamp - a.timestamp);

            tbody.innerHTML = sortedHistory.map(log => `
                <tr>
                    <td style="font-weight: 500;">${log.timerName}</td>
                    <td><span class="tag tag-${log.type}">${log.type.toUpperCase()}</span></td>
                    <td class="hide-mobile date-text">${formatDate(log.timestamp)}</td>
                    <td class="duration-text">${log.duration > 0 ? '+' : ''}${formatTime(log.duration)}</td>
                    <td style="text-align: left;">
                        <button class="btn-delete" onclick="deleteLog('${log.id}')" title="Delete">×</button>
                    </td>
                </tr>
            `).join('');
        }

        renderHistory();
    </script>
</body>
</html>
